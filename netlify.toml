# Déploiement Netlify (projet portfolioq-c → quentincontreau.com)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  VITE_SITE_URL = "https://quentincontreau.com"

# Cache long pour les fichiers versionnés par Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
